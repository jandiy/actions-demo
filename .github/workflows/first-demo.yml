name: first-ci

on: 
 push:
   branches:
    - main 
 workflow_dispatch: 

jobs:
  first-job:
    environment: dev
    env: 
     PASS: ${{ secrets.PASS_USER }}
    runs-on: ubuntu-22.04
    steps:
      - name: Get Code 
        uses: actions/checkout@v3

      - name: Install NodeJs 
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          ls
          cd angular
          npm ci

      - name: Run test
        run: |
          cd angular
          npm test

      - name: Build apk
        run: |
          cd angular
          npm run build
          echo $PASS
          echo ${{ env.NAME_USER }}
          echo ${{ secrets.PASS_USER }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
           name: dist-files
           path: angular/dist

  deploy:
    needs: first-job
    runs-on: ubuntu-22.04
    steps:
      - name: Get build artifacts 
        uses: actions/download-artifact@v8
        with:
           name: dist-files
      - name: see files
        run: |
          ls


name: first-ci

on: push

jobs:
  first-job:
    runs-on: ubuntu-22.04
    steps:
      - name: Get Code 
        uses: actions/checkout@v3

      - name: Ubicarse en la carpeta
        run: |
          ls
          cd angular

      - name: Install NodeJs 
        uses: actions/setup-node@v5
        with:
          node-version: 18
          
      - name: Install dependencies
        run: |
          ls
          npm ci

      - name: Run test
        run: npm test
